name: Sync fork via API
on:
schedule:
- cron: "0 3 * * *"
workflow_dispatch:
permissions:
contents: write
jobs:
sync:
runs-on: ubuntu-latest
steps:
- name: Upstream in develop mergen
env:
GH_TOKEN: secrets.GITHUBTOKENOWNERREPO:{{ github.repository }}
BRANCH: develop
run: |
set -euo pipefail
http_code=$(curl -sS -L -w "%{http_code}" -o resp.json
-X POST
-H "Accept: application/vnd.github+json"
-H "Authorization: Bearer $GH_TOKEN"
-H "X-GitHub-Api-Version: 2022-11-28"
" https://api.github.com/repos/$OWNER_REPO/merge-upstream "
-d "{ "branch ": "$BRANCH "}")
echo "HTTP $http_code"
cat resp.json
test "$http_code" -lt 400

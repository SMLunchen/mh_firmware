name: Sync fork via API
on:
schedule:
- cron: "0 3 * * " # täglich 03:00 UTC
workflow_dispatch:
permissions:
contents: write
jobs:
sync:
runs-on: ubuntu-latest
steps:
- name: Default-Branch ermitteln
id: meta
env:
GH_TOKEN: secrets.GITHUBTOKENOWNERREPO:{{ github.repository }}
run: |
set -euo pipefail
resp=(curl -sS -L \
-H "Accept: application/vnd.github+json" \
-H "Authorization: Bearer $GH_TOKEN" \
-H "X-GitHub-Api-Version: 2022-11-28" \
"https://api.github.com/repos/$OWNER_REPO")
branch=(printf "%s" "$resp" | grep -o '"default_branch":"[^"]"' | head -n1 | cut -d':' -f2 | tr -d '"')
if [ -z "$branch" ]; then branch="main"; fi
echo "default_branch=$branch" >> "$GITHUB_OUTPUT"

- name: Upstream in Default-Branch mergen
env:
GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
OWNER_REPO: ${{ github.repository }}
run: |
set -euo pipefail
BRANCH="${{ steps.meta.outputs.default_branch }}"
echo "Sync $OWNER_REPO branch $BRANCH via merge-upstream..."
http_code=$(curl -sS -L -w "%{http_code}" -o resp.json \
-X POST \
-H "Accept: application/vnd.github+json" \
-H "Authorization: Bearer $GH_TOKEN" \
-H "X-GitHub-Api-Version: 2022-11-28" \
"https://api.github.com/repos/$OWNER_REPO/merge-upstream" \
-d "{\"branch\":\"$BRANCH\"}")
cat resp.json
if [ "$http_code" -ge 400 ]; then
echo "Fehler: HTTP $http_code"
exit 1
fi

name: Sync, config and build
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific git tag to build (leave empty for latest develop)'
        required: false
        type: string
      boards:
        description: 'Boards to build'
        required: false
        default: "heltec-v3 heltec-wireless-tracker-V1-0 rak4631 heltec-wireless-tracker heltec-v4"
        type: string
  push:
    tags:
      - 'v*'  # Automatisch bei neuen Version-Tags

permissions:
  contents: write

jobs:
  sync_build:
    runs-on: ubuntu-latest
    env:
      BRANCH: develop
      DOCKER_IMAGE: infinitecoding/platformio-for-ci:latest
      BOARDS: ${{ github.event.inputs.boards || 'heltec-v3 heltec-wireless-tracker-V1-0' }}
      CONFIG_SRC: my-userprefs.jsonc
      CONFIG_DEST: userPrefs.jsonc
      OWNER_REPO: ${{ github.repository }}
      BACKEND_REPO: "SMLunchen/mh_flasher_backend"
      
    steps:
      - name: Bestimme Build-Target
        id: target
        run: |
          if [ -n "${{ github.event.inputs.target_tag }}" ]; then
            echo "target_ref=${{ github.event.inputs.target_tag }}" >> $GITHUB_OUTPUT
            echo "is_tag_build=true" >> $GITHUB_OUTPUT
            echo "build_type=manual-tag" >> $GITHUB_OUTPUT
            echo "🏷️ Building specific tag: ${{ github.event.inputs.target_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            echo "target_ref=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "is_tag_build=true" >> $GITHUB_OUTPUT
            echo "build_type=pushed-tag" >> $GITHUB_OUTPUT
            echo "🏷️ Building pushed tag: $TAG_NAME"
          else
            echo "target_ref=develop" >> $GITHUB_OUTPUT
            echo "is_tag_build=false" >> $GITHUB_OUTPUT  
            echo "build_type=develop" >> $GITHUB_OUTPUT
            echo "🔄 Building develop branch"
          fi

      - name: Fork mit Upstream mergen
        if: steps.target.outputs.is_tag_build == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "🔄 Merging upstream changes..."
          http_code=$(curl -sS -L -w "%{http_code}" -o resp.json \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$OWNER_REPO/merge-upstream" \
            -d "{\"branch\":\"$BRANCH\"}")
          cat resp.json
          if [ "$http_code" -eq 409 ]; then
            echo "❌ Merge-Konflikt. Bitte manuell lösen."
            exit 1
          fi
          test "$http_code" -lt 400

      - name: Repo klonen und Config sichern
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_REF="${{ steps.target.outputs.target_ref }}"
          IS_TAG_BUILD="${{ steps.target.outputs.is_tag_build }}"
          
          echo "=== 📥 Repository Clone ==="
          echo "Target: $TARGET_REF"
          echo "Is Tag Build: $IS_TAG_BUILD"
          
          if [ "$IS_TAG_BUILD" == "true" ]; then
            echo "🏷️ Cloning fork and checking out tag: $TARGET_REF"
            
            # Clone DEINEN Fork (nicht upstream!)
            git clone "https://x-access-token:${TOKEN}@github.com/${OWNER_REPO}.git" repo
            cd repo
            
            # WICHTIG: Config-Datei JETZT sichern (bevor wir zum Tag wechseln)
            if [ -f "$CONFIG_SRC" ]; then
              echo "💾 Sichere $CONFIG_SRC aus Fork..."
              cp "$CONFIG_SRC" "../${CONFIG_SRC}.backup"
              echo "✅ Config gesichert nach ../${CONFIG_SRC}.backup"
            else
              echo "⚠️ $CONFIG_SRC nicht im Fork gefunden"
            fi
            
            # Jetzt zum Tag wechseln
            git fetch --tags
            git checkout "tags/$TARGET_REF"
            git submodule update --init --recursive
            
            # Config zurückkopieren
            if [ -f "../${CONFIG_SRC}.backup" ]; then
              echo "📥 Stelle $CONFIG_SRC wieder her..."
              cp "../${CONFIG_SRC}.backup" "$CONFIG_SRC"
              echo "✅ Config wiederhergestellt"
            fi
            
          else
            echo "🔄 Cloning develop branch"
            git clone --depth=1 --branch "$BRANCH" "https://x-access-token:${TOKEN}@github.com/${OWNER_REPO}.git" repo
            cd repo
            git submodule update --init --recursive
          fi
          
          # Prüfe ob Clone erfolgreich war
          if [ ! -d "../repo" ]; then
            echo "❌ FEHLER: Repository wurde nicht geklont!"
            exit 1
          fi
          
          echo "✅ Repository erfolgreich geklont"
          echo ""
          echo "Verfügbare Config-Dateien:"
          ls -la *.jsonc 2>/dev/null || echo "  (keine .jsonc Dateien gefunden)"

      - name: userPrefs bereitstellen
        env:
          USERPREFS_B64: ${{ secrets.USERPREFS_JSONC_B64 }}
        run: |
          set -euo pipefail
          
          if [ ! -d "repo" ]; then
            echo "❌ FEHLER: 'repo' Verzeichnis existiert nicht!"
            exit 1
          fi
          
          cd repo
          
          echo "=== 📋 UserPrefs bereitstellen ==="
          echo "Aktuelles Verzeichnis: $(pwd)"
          
          # Prioritäten:
          # 1. GitHub Secret (USERPREFS_B64)
          # 2. Datei die bereits im repo liegt (aus dem vorherigen Step)
          # 3. Datei aus Workflow-Root
          
          if [ -n "$USERPREFS_B64" ]; then
            echo "🔑 Verwende userPrefs aus GitHub Secret..."
            echo "$USERPREFS_B64" | base64 -d > "$CONFIG_DEST"
            echo "✅ userPrefs aus Secret geschrieben."
          elif [ -f "$CONFIG_SRC" ]; then
            echo "📄 userPrefs bereits vorhanden (aus Fork): $CONFIG_SRC"
            if [ "$CONFIG_SRC" != "$CONFIG_DEST" ]; then
              cp "$CONFIG_SRC" "$CONFIG_DEST"
              echo "✅ Kopiert: $CONFIG_SRC -> $CONFIG_DEST"
            fi
          else
            echo "⚠️ WARNUNG: Keine userPrefs gefunden!"
            echo "Gesucht wurde:"
            echo "  - GitHub Secret: USERPREFS_JSONC_B64"
            echo "  - Datei im Repo: $(pwd)/$CONFIG_SRC"
            echo ""
            echo "Verfügbare .jsonc Dateien:"
            ls -la *.jsonc 2>/dev/null || echo "  (keine gefunden)"
            echo ""
            echo "⚠️ Build wird mit Meshtastic-Defaults fortgesetzt."
          fi
          
          # Zeige Inhalt
          if [ -f "$CONFIG_DEST" ]; then
            echo ""
            echo "=== ✅ UserPrefs Inhalt (erste 15 Zeilen) ==="
            head -n 15 "$CONFIG_DEST"
          fi
          
      - name: platformio-custom.py für alle Plattformen erweitern
        run: |
          set -euo pipefail
          cd repo
          
          # Backup des Original-Scripts
          cp bin/platformio-custom.py bin/platformio-custom.py.backup
          
          # Erstelle die erweiterte Version
          cat > bin/platformio-custom-extended.py << 'EOF'
          #!/usr/bin/env python3
          # trunk-ignore-all(ruff/F821)
          # trunk-ignore-all(flake8/F821): For SConstruct imports
          import sys
          from os.path import join
          import subprocess
          import json
          import re
          import time
          import os
          from datetime import datetime
          from readprops import readProps
          Import("env")
          platform = env.PioPlatform()
          
          def apply_user_prefs():
              """Apply user preferences for all platforms"""
              jsonLoc = env["PROJECT_DIR"] + "/userPrefs.jsonc"
              if not os.path.exists(jsonLoc):
                  print("No userPrefs.jsonc found, skipping user preferences")
                  return []
              
              with open(jsonLoc) as f:
                  jsonStr = re.sub("//.*","", f.read(), flags=re.MULTILINE)
                  try:
                      userPrefs = json.loads(jsonStr)
                  except json.JSONDecodeError as e:
                      print(f"Error parsing userPrefs.jsonc: {e}")
                      return []

              pref_flags = []
              # Pre-process the userPrefs
              for pref in userPrefs:
                  if userPrefs[pref].startswith("{"):
                      pref_flags.append("-D" + pref + "=" + userPrefs[pref])
                  elif userPrefs[pref].lstrip("-").replace(".", "").isdigit():
                      pref_flags.append("-D" + pref + "=" + userPrefs[pref])
                  elif userPrefs[pref] == "true" or userPrefs[pref] == "false":
                      pref_flags.append("-D" + pref + "=" + userPrefs[pref])
                  elif userPrefs[pref].startswith("meshtastic_"):
                      pref_flags.append("-D" + pref + "=" + userPrefs[pref])
                  else:
                      pref_flags.append("-D" + pref + "=" + env.StringifyMacro(userPrefs[pref]))
              
              return pref_flags

          def esp32_create_combined_bin(source, target, env):
              # this sub is borrowed from ESPEasy build toolchain. It's licensed under GPL V3
              # https://github.com/letscontrolit/ESPEasy/blob/mega/tools/pio/post_esp32.py
              print("Generating combined binary for serial flashing")
              app_offset = 0x10000
              new_file_name = env.subst("$BUILD_DIR/${PROGNAME}.factory.bin")
              sections = env.subst(env.get("FLASH_EXTRA_IMAGES"))
              firmware_name = env.subst("$BUILD_DIR/${PROGNAME}.bin")
              chip = env.get("BOARD_MCU")
              flash_size = env.BoardConfig().get("upload.flash_size")
              flash_freq = env.BoardConfig().get("build.f_flash", "40m")
              flash_freq = flash_freq.replace("000000L", "m")
              flash_mode = env.BoardConfig().get("build.flash_mode", "dio")
              memory_type = env.BoardConfig().get("build.arduino.memory_type", "qio_qspi")
              if flash_mode == "qio" or flash_mode == "qout":
                  flash_mode = "dio"
              if memory_type == "opi_opi" or memory_type == "opi_qspi":
                  flash_mode = "dout"
              cmd = [
                  "--chip",
                  chip,
                  "merge_bin",
                  "-o",
                  new_file_name,
                  "--flash_mode",
                  flash_mode,
                  "--flash_freq",
                  flash_freq,
                  "--flash_size",
                  flash_size,
              ]
              print("    Offset | File")
              for section in sections:
                  sect_adr, sect_file = section.split(" ", 1)
                  print(f" -  {sect_adr} | {sect_file}")
                  cmd += [sect_adr, sect_file]
              print(f" - {hex(app_offset)} | {firmware_name}")
              cmd += [hex(app_offset), firmware_name]
              print("Using esptool.py arguments: %s" % " ".join(cmd))
              esptool.main(cmd)

          if platform.name == "espressif32":
              sys.path.append(join(platform.get_package_dir("tool-esptoolpy")))
              import esptool
              env.AddPostAction("$BUILD_DIR/${PROGNAME}.bin", esp32_create_combined_bin)
              esp32_kind = env.GetProjectOption("custom_esp32_kind")
              if esp32_kind == "esp32":
                  # Free up some IRAM by removing auxiliary SPI flash chip drivers.
                  # Wrapped stub symbols are defined in src/platform/esp32/iram-quirk.c.
                  env.Append(
                      LINKFLAGS=[
                          "-Wl,--wrap=esp_flash_chip_gd",
                          "-Wl,--wrap=esp_flash_chip_issi",
                          "-Wl,--wrap=esp_flash_chip_winbond",
                      ]
                  )
              else:
                  # For newer ESP32 targets, using newlib nano works better.
                  env.Append(LINKFLAGS=["--specs=nano.specs", "-u", "_printf_float"])

          if platform.name == "nordicnrf52":
              env.AddPostAction("$BUILD_DIR/${PROGNAME}.hex",
                                env.VerboseAction(f"\"{sys.executable}\" ./bin/uf2conv.py \"$BUILD_DIR/firmware.hex\" -c -f 0xADA52840 -o \"$BUILD_DIR/firmware.uf2\"",
                                                  "Generating UF2 file"))

          Import("projenv")
          prefsLoc = projenv["PROJECT_DIR"] + "/version.properties"
          verObj = readProps(prefsLoc)
          print("Using meshtastic platformio-custom.py, firmware version " + verObj["long"] + " on " + env.get("PIOENV"))

          # get repository owner if git is installed
          try:
              r_owner = (
                  subprocess.check_output(["git", "config", "--get", "remote.origin.url"])
                  .decode("utf-8")
                  .strip().split("/")
              )
              repo_owner = r_owner[-2] + "/" + r_owner[-1].replace(".git", "")
          except subprocess.CalledProcessError:
              repo_owner = "unknown"

          # Load user preferences for ALL platforms
          user_pref_flags = apply_user_prefs()

          # Calculate unix epoch for current day (midnight)
          current_date = datetime.now().replace(hour=0, minute=0, second=0, microsecond=0)
          build_epoch = int(current_date.timestamp())

          flags = [
                  "-DAPP_VERSION=" + verObj["long"],
                  "-DAPP_VERSION_SHORT=" + verObj["short"],
                  "-DAPP_ENV=" + env.get("PIOENV"),
                  "-DAPP_REPO=" + repo_owner,
                  "-DBUILD_EPOCH=" + str(build_epoch),
              ] + user_pref_flags

          print ("Using flags:")
          for flag in flags:
              print(flag)

          projenv.Append(
              CCFLAGS=flags,
          )

          for lb in env.GetLibBuilders():
              if lb.name == "meshtastic-device-ui":
                  lb.env.Append(CPPDEFINES=[("APP_VERSION", verObj["long"])])
                  break

          # Get the display resolution from macros
          def get_display_resolution(build_flags):
              # Check "DISPLAY_SIZE" to determine the screen resolution
              for flag in build_flags:
                  if isinstance(flag, tuple) and flag[0] == "DISPLAY_SIZE":
                      screen_width, screen_height = map(int, flag[1].split("x"))
                      return screen_width, screen_height
              print("No screen resolution defined in build_flags. Please define DISPLAY_SIZE.")
              exit(1)

          def load_boot_logo(source, target, env):
              build_flags = env.get("CPPDEFINES", [])
              logo_w, logo_h = get_display_resolution(build_flags)
              print(f"TFT build with {logo_w}x{logo_h} resolution detected")
              # Load the boot logo from `branding/logo_<width>x<height>.png` if it exists
              source_path = join(env["PROJECT_DIR"], "branding", f"logo_{logo_w}x{logo_h}.png")
              dest_dir = join(env["PROJECT_DIR"], "data", "boot")
              dest_path = join(dest_dir, "logo.png")
              if env.File(source_path).exists():
                  print(f"Loading boot logo from {source_path}")
                  # Prepare the destination
                  env.Execute(f"mkdir -p {dest_dir} && rm -f {dest_path}")
                  # Copy the logo to the `data/boot` directory
                  env.Execute(f"cp {source_path} {dest_path}")

          # Load the boot logo on TFT builds
          if ("HAS_TFT", 1) in env.get("CPPDEFINES", []):
              env.AddPreAction('$BUILD_DIR/littlefs.bin', load_boot_logo)
          EOF
          
          # Ersetze das Original-Script
          mv bin/platformio-custom-extended.py bin/platformio-custom.py
          chmod +x bin/platformio-custom.py
          
          echo "✅ platformio-custom.py wurde für alle Plattformen erweitert"
          
      - name: Build-Flags aus userPrefs.jsonc generieren
        id: build_flags
        run: |
          set -euo pipefail
          cd repo
          
          if [ ! -f "userPrefs.jsonc" ]; then
            echo "⚠️ Keine userPrefs.jsonc gefunden - verwende Meshtastic Defaults"
            echo "build_flags=" >> $GITHUB_OUTPUT
            echo "EXTRA_BUILD_FLAGS=" >> $GITHUB_ENV
            exit 0
          fi
          
          echo "📖 Generiere Build-Flags aus userPrefs.jsonc..."
          
          BUILD_FLAGS=$(python3 << 'PYEOF'
          import json
          import re
          import sys
          
          with open('userPrefs.jsonc', 'r') as f:
              json_str = re.sub(r'//.*', '', f.read(), flags=re.MULTILINE)
              try:
                  prefs = json.loads(json_str)
              except json.JSONDecodeError as e:
                  print(f"Error parsing userPrefs.jsonc: {e}", file=sys.stderr)
                  sys.exit(1)
          
          flags = []
          for key, value in prefs.items():
              if isinstance(value, str):
               escaped = str(value).replace('"', '\\"')
               flags.append(f'-D{key}="{escaped}"')
              else:
               flags.append(f'-D{key}={value}')
          
          print(' '.join(flags))
          PYEOF
          )
          
          if [ -z "$BUILD_FLAGS" ]; then
            echo "⚠️ Keine Build-Flags generiert"
            echo "build_flags=" >> $GITHUB_OUTPUT
            echo "EXTRA_BUILD_FLAGS=" >> $GITHUB_ENV
            exit 0
          fi
          
          echo "build_flags=$BUILD_FLAGS" >> $GITHUB_OUTPUT
          echo "EXTRA_BUILD_FLAGS=$BUILD_FLAGS" >> $GITHUB_ENV
          
          echo "✅ Build-Flags generiert ($(echo "$BUILD_FLAGS" | wc -w) Flags):"
          echo "$BUILD_FLAGS" | tr ' ' '\n' | head -20

      - name: Docker Image ziehen
        run: |
          set -euo pipefail
          docker pull "$DOCKER_IMAGE"

      - name: Build (PlatformIO im Docker) - KORRIGIERT
        run: |
          set -euo pipefail
          cd repo
          mkdir -p .pio
          
          # Build-Flags aus vorherigem Step holen
          EXTRA_FLAGS="${{ steps.build_flags.outputs.build_flags }}"
          
          for b in $BOARDS; do
            echo "🔨 Build $b mit UserPrefs..."
            echo "Extra Flags: ${EXTRA_FLAGS:0:200}..."
            
            # Build mit zusätzlichen Flags
            docker run --rm \
              -v "$PWD:/workspace" \
              -w /workspace \
              -e "PLATFORMIO_BUILD_FLAGS=$EXTRA_FLAGS" \
              "$DOCKER_IMAGE" \
              bash -lc "platformio run -e $b"
          done
          
          echo "✅ Build abgeschlossen"

      - name: Versionsnummer bestimmen
        id: version
        run: |
          set -euo pipefail
          cd repo
          
          MESHTASTIC_VERSION=""
          IS_TAG_BUILD="${{ steps.target.outputs.is_tag_build }}"
          TARGET_REF="${{ steps.target.outputs.target_ref }}"
          BUILD_TYPE="${{ steps.target.outputs.build_type }}"
          
          echo "=== 🏷️ Git Tag Detection ==="
          echo "Build Type: $BUILD_TYPE"
          echo "Is Tag Build: $IS_TAG_BUILD"
          echo "Target Ref: $TARGET_REF"
          
          # Für Tag-Builds: Verwende den Tag direkt
          if [ "$IS_TAG_BUILD" == "true" ] && [[ "$TARGET_REF" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            MESHTASTIC_VERSION="${BASH_REMATCH[1]}"
            echo "✅ Using specified tag version: $MESHTASTIC_VERSION"
          fi
          
          # Fallback-Methoden für develop builds
          if [ -z "$MESHTASTIC_VERSION" ]; then
            CURRENT_TAG=$(git describe --exact-match --tags HEAD 2>/dev/null || echo "")
            if [ -n "$CURRENT_TAG" ]; then
              echo "✅ Current commit is on tag: $CURRENT_TAG"
              MESHTASTIC_VERSION="${CURRENT_TAG#v}"
            fi
          fi
          
          if [ -z "$MESHTASTIC_VERSION" ]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ]; then
              echo "✅ Latest reachable tag: $LATEST_TAG"
              MESHTASTIC_VERSION="${LATEST_TAG#v}"
            fi
          fi
          
          if [ -z "$MESHTASTIC_VERSION" ]; then
            echo "📋 Available tags:"
            git tag --sort=-version:refname | head -10 || true
            LATEST_TAG=$(git tag --sort=-version:refname | head -1 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ]; then
              echo "✅ Using latest available tag: $LATEST_TAG"
              MESHTASTIC_VERSION="${LATEST_TAG#v}"
            fi
          fi
          
          # Source-Code Fallback
          if [ -z "$MESHTASTIC_VERSION" ]; then
            echo "🔍 Trying to extract version from source files..."
            for file in "src/mesh/generated/version.h" "version.h" "src/main.cpp" "platformio.ini"; do
              if [ -f "$file" ]; then
                echo "Checking $file"
                VERSION_FOUND=$(grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' "$file" | head -1 || echo "")
                if [ -n "$VERSION_FOUND" ]; then
                  MESHTASTIC_VERSION="$VERSION_FOUND"
                  echo "✅ Found version in $file: $MESHTASTIC_VERSION"
                  break
                fi
              fi
            done
          fi
          
          # Final Fallback
          if [ -z "$MESHTASTIC_VERSION" ]; then
            MESHTASTIC_VERSION="2.7.12"
            echo "⚠️ Using fallback version: $MESHTASTIC_VERSION"
          fi
          
          # Git-Info
          GIT_HASH=$(git rev-parse --short HEAD)
          TS=$(date -u +%Y%m%d-%H%M%S)
          
          # Versionen je nach Build-Typ
          if [ "$IS_TAG_BUILD" == "true" ]; then
            # Für Tags: Saubere Version ohne Timestamp
            FULL_VERSION="${MESHTASTIC_VERSION}-mh-${GIT_HASH}"
            SHORT_VERSION="${MESHTASTIC_VERSION}-mh"
            DISPLAY_VERSION="${MESHTASTIC_VERSION}-MH"
            echo "🏷️ Tag build - clean versioning"
          else
            # Für develop: Mit Timestamp
            FULL_VERSION="${MESHTASTIC_VERSION}-mh-${GIT_HASH}-${TS}"
            SHORT_VERSION="${MESHTASTIC_VERSION}-mh-${GIT_HASH}"
            DISPLAY_VERSION="${MESHTASTIC_VERSION}-MH-dev"
            echo "🔄 Develop build - timestamped versioning"
          fi
          
          echo "base_version=$MESHTASTIC_VERSION" >> $GITHUB_OUTPUT
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "short_version=$SHORT_VERSION" >> $GITHUB_OUTPUT
          echo "display_version=$DISPLAY_VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$TS" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          
          echo "=== 📋 Final Version Info ==="
          echo "Meshtastic Base: $MESHTASTIC_VERSION"
          echo "Full Version: $FULL_VERSION"
          echo "Short Version: $SHORT_VERSION"  
          echo "Display Version: $DISPLAY_VERSION"
          echo "Build Type: $BUILD_TYPE"

      # Rest der Steps bleiben gleich...
      - name: Firmware einsammeln und strukturieren
        id: firmware
        run: |
          set -euo pipefail
          mkdir -p firmware-output
          cd repo
          
          VERSION="${{ steps.version.outputs.version }}"
          COLLECTED_BOARDS=""
          
          for b in $BOARDS; do
            echo "📦 Sammle Firmware für Board: $b"
            BOARD_FILES=""
            
            # Suche nach Firmware-Dateien in verschiedenen Varianten
            for variant in "" "-factory" "-update" "-ota"; do
              for ext in bin uf2 hex; do
                possible_files=(
                  ".pio/build/$b/firmware${variant}.$ext"
                  ".pio/build/$b/firmware.$ext"
                  "build_output/$b/firmware${variant}.$ext"
                )
                
                for f in "${possible_files[@]}"; do
                  if [ -f "$f" ]; then
                    target_name="firmware-${b}${variant}-${VERSION}.$ext"
                    cp "$f" "../firmware-output/$target_name"
                    echo "✅ Kopiert: $f -> $target_name"
                    BOARD_FILES="$BOARD_FILES $target_name"
                    break
                  fi
                done
              done
            done
            
            # Fallback: Wenn keine Varianten gefunden, suche nach generischen Dateien
            if [ -z "$BOARD_FILES" ]; then
              for ext in bin uf2 hex; do
                f=".pio/build/$b/firmware.$ext"
                if [ -f "$f" ]; then
                  target_name="firmware-${b}-${VERSION}.$ext"
                  cp "$f" "../firmware-output/$target_name"
                  echo "✅ Kopiert (generic): $f -> $target_name"
                  BOARD_FILES="$BOARD_FILES $target_name"
                  
                  # Erstelle zusätzliche Varianten
                  cp "$f" "../firmware-output/firmware-${b}-factory-${VERSION}.$ext"
                  cp "$f" "../firmware-output/firmware-${b}-update-${VERSION}.$ext"
                fi
              done
            fi
            
            if [ -n "$BOARD_FILES" ]; then
              COLLECTED_BOARDS="$COLLECTED_BOARDS $b"
            else
              echo "⚠️ WARNUNG: Keine Firmware für Board $b gefunden"
            fi
          done
          
          cd ..
          echo "collected_boards=$COLLECTED_BOARDS" >> $GITHUB_OUTPUT
          
          echo "=== 📦 Gesammelte Firmware-Dateien ==="
          ls -lah firmware-output/ || true

      # Rest deiner Steps bleibt unverändert...
      - name: Release erstellen
        id: release
        if: steps.firmware.outputs.collected_boards != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_DATE="${{ steps.version.outputs.build_date }}"
          BUILD_TYPE="${{ steps.version.outputs.build_type }}"
          TAG="firmware-${VERSION}"
          NAME="Firmware Build ${VERSION}"
          API="https://api.github.com/repos/${OWNER_REPO}"
          
          # Release body erstellen
          cat > release_body.md << EOF
          # 🚀 Automatischer Firmware Build
          
          **Version:** ${VERSION}  
          **Build-Datum:** ${BUILD_DATE}  
          **Build-Typ:** ${BUILD_TYPE}  
          **Boards:** ${{ steps.firmware.outputs.collected_boards }}
          
          ## 🔧 Änderungen
          - Automatischer Sync mit Upstream
          - Custom userPrefs angewendet
          - Für folgende Hardware gebaut: ${{ steps.firmware.outputs.collected_boards }}
          
          ## 📱 Installation
          Verwende den [Web Flasher](https://flasher.schwarzes-seelenreich.de) für einfache Installation.
          EOF
          
          # jq installieren falls nicht vorhanden
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi
          
          # Release erstellen
          http=$(curl -sS -L -w "%{http_code}" -o resp.json \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API/releases" \
            -d "{
              \"tag_name\":\"$TAG\",
              \"name\":\"$NAME\",
              \"body\":$(jq -Rs . release_body.md),
              \"draft\":false,
              \"prerelease\":true
            }")
          
          echo "Create release HTTP: $http"
          
          if [ "$http" -eq 422 ]; then
            echo "Release bereits vorhanden, lade bestehende..."
            curl -sS -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$API/releases/tags/$TAG" -o resp.json
          elif [ "$http" -ge 400 ]; then
            echo "Release-Erstellung fehlgeschlagen!"
            cat resp.json
            exit 1
          fi
          
          # Upload URL extrahieren
          upload_url=$(jq -r '.upload_url | sub("\\{.*$"; "")' resp.json)
          release_id=$(jq -r '.id' resp.json)
          
          echo "upload_url=$upload_url" >> $GITHUB_OUTPUT
          echo "release_id=$release_id" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

      - name: Assets hochladen
        if: steps.release.outputs.upload_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          upload_url="${{ steps.release.outputs.upload_url }}"
          
          shopt -s nullglob
          for path in firmware-output/*; do
            [ -f "$path" ] || continue
            name=$(basename "$path")
            
            echo "📤 Upload: $name"
            http=$(curl -sS -L -w "%{http_code}" -o /dev/null \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              "${upload_url}?name=${name}" \
              --data-binary @"$path")
            
            if [ "$http" -ge 400 ]; then
              echo "❌ FEHLER beim Upload von $name (HTTP $http)"
              exit 1
            else
              echo "✅ $name hochgeladen (HTTP $http)"
            fi
          done

      - name: Backend benachrichtigen
        if: steps.release.outputs.tag_name != ''
        env:
          GH_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
        run: |
          set -euo pipefail
          
          VERSION="${{ steps.version.outputs.version }}"
          SHORT_VERSION="${{ steps.version.outputs.short_version }}"
          BUILD_DATE="${{ steps.version.outputs.build_date }}"
          TAG="${{ steps.release.outputs.tag_name }}"
          RELEASE_URL="https://github.com/${OWNER_REPO}/releases/tag/${TAG}"
          DISPLAY_VERSION="${{ steps.version.outputs.display_version }}"
          BASE_VERSION="${{ steps.version.outputs.base_version }}"
          BUILD_TYPE="${{ steps.version.outputs.build_type }}"
          
          # Boards-Array für JSON erstellen
          BOARDS_RAW="${{ steps.firmware.outputs.collected_boards }}"
          echo "Raw boards: '$BOARDS_RAW'"
          
          BOARDS_JSON="[]"
          if [ -n "$BOARDS_RAW" ]; then
            BOARDS_JSON=$(echo "$BOARDS_RAW" | jq -R 'split(" ") | map(select(. != ""))')
          fi
          
          echo "=== 📡 Backend Notification Debug ==="
          echo "Version: $VERSION"
          echo "Short Version: $SHORT_VERSION"
          echo "Display Version: $DISPLAY_VERSION"
          echo "Build Type: $BUILD_TYPE"
          echo "Download Base URL: https://github.com/${OWNER_REPO}/releases/download/${TAG}"
          echo "Boards JSON: $BOARDS_JSON"
          
          DISPATCH_PAYLOAD="{
            \"event_type\": \"firmware-built\",
            \"client_payload\": {
              \"version\": \"$VERSION\",
              \"short_version\": \"$SHORT_VERSION\",
              \"base_version\": \"$BASE_VERSION\",
              \"display_version\": \"$DISPLAY_VERSION\",
              \"build_date\": \"$BUILD_DATE\",
              \"build_type\": \"$BUILD_TYPE\",
              \"tag_name\": \"$TAG\",
              \"release_url\": \"$RELEASE_URL\",
              \"download_base_url\": \"https://github.com/${OWNER_REPO}/releases/download/${TAG}\",
              \"boards\": $BOARDS_JSON,
              \"branch\": \"$BRANCH\"
            }
          }"
          
          echo "Dispatch payload:"
          echo "$DISPATCH_PAYLOAD" | jq .
          
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${BACKEND_REPO}/dispatches" \
            -d "$DISPATCH_PAYLOAD"
          
          echo "✅ Backend benachrichtigt für Version: $VERSION"

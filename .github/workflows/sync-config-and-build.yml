name: Sync, config and build
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific git tag to build (leave empty for latest develop)'
        required: false
        type: string
      boards:
        description: 'Boards to build'
        required: false
        default: "heltec-v3 heltec-wireless-tracker-V1-0 rak4631"
        type: string
  push:
    tags:
      - 'v*'  # Automatisch bei neuen Version-Tags

permissions:
  contents: write

jobs:
  sync_build:
    runs-on: ubuntu-latest
    env:
      BRANCH: develop
      DOCKER_IMAGE: infinitecoding/platformio-for-ci:latest
      BOARDS: ${{ github.event.inputs.boards || 'heltec-v3 heltec-wireless-tracker-V1-0' }}
      CONFIG_SRC: my-userprefs.jsonc
      CONFIG_DEST: userPrefs.jsonc
      OWNER_REPO: ${{ github.repository }}
      BACKEND_REPO: "SMLunchen/mh_flasher_backend"
      
    steps:
      - name: Bestimme Build-Target
        id: target
        run: |
          if [ -n "${{ github.event.inputs.target_tag }}" ]; then
            echo "target_ref=${{ github.event.inputs.target_tag }}" >> $GITHUB_OUTPUT
            echo "is_tag_build=true" >> $GITHUB_OUTPUT
            echo "build_type=manual-tag" >> $GITHUB_OUTPUT
            echo "🏷️ Building specific tag: ${{ github.event.inputs.target_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            echo "target_ref=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "is_tag_build=true" >> $GITHUB_OUTPUT
            echo "build_type=pushed-tag" >> $GITHUB_OUTPUT
            echo "🏷️ Building pushed tag: $TAG_NAME"
          else
            echo "target_ref=develop" >> $GITHUB_OUTPUT
            echo "is_tag_build=false" >> $GITHUB_OUTPUT  
            echo "build_type=develop" >> $GITHUB_OUTPUT
            echo "🔄 Building develop branch"
          fi

      - name: Fork mit Upstream mergen
        if: steps.target.outputs.is_tag_build == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "🔄 Merging upstream changes..."
          http_code=$(curl -sS -L -w "%{http_code}" -o resp.json \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$OWNER_REPO/merge-upstream" \
            -d "{\"branch\":\"$BRANCH\"}")
          cat resp.json
          if [ "$http_code" -eq 409 ]; then
            echo "❌ Merge-Konflikt. Bitte manuell lösen."
            exit 1
          fi
          test "$http_code" -lt 400

      - name: Repo klonen
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_REF="${{ steps.target.outputs.target_ref }}"
          IS_TAG_BUILD="${{ steps.target.outputs.is_tag_build }}"
          
          if [ "$IS_TAG_BUILD" == "true" ]; then
            echo "🏷️ Cloning repository and checking out tag: $TARGET_REF"
            git clone "https://x-access-token:${TOKEN}@github.com/${OWNER_REPO}.git" repo
            cd repo
            git fetch --tags
            git checkout "tags/$TARGET_REF"
            git submodule update --init --recursive
          else
            echo "🔄 Cloning develop branch"
            git clone --depth=1 --branch "$BRANCH" "https://x-access-token:${TOKEN}@github.com/${OWNER_REPO}.git" repo
            cd repo
            git submodule update --init --recursive
          fi

      - name: userPrefs bereitstellen
        env:
          USERPREFS_B64: ${{ secrets.USERPREFS_JSONC_B64 }}
        run: |
          set -euo pipefail
          cd repo
          if [ -n "$USERPREFS_B64" ]; then
            echo "$USERPREFS_B64" | base64 -d > "$CONFIG_DEST"
            echo "✅ userPrefs aus Secret geschrieben."
          elif [ -f "$CONFIG_SRC" ]; then
            cp "$CONFIG_SRC" "$CONFIG_DEST"
            echo "✅ userPrefs aus Repo ($CONFIG_SRC) kopiert."
          else
            echo "⚠️ WARN: Weder Secret noch $CONFIG_SRC gefunden. Es wird mit Defaults gebaut."
          fi
          head -n 5 "$CONFIG_DEST" || true

      - name: Docker Image ziehen
        run: |
          set -euo pipefail
          docker pull "$DOCKER_IMAGE"

      - name: Build (PlatformIO im Docker)
        run: |
          set -euo pipefail
          cd repo
          mkdir -p .pio
          for b in $BOARDS; do
            echo "🔨 Build $b..."
            docker run --rm \
              -v "$PWD:/workspace" \
              -w /workspace \
              "$DOCKER_IMAGE" \
              bash -lc "platformio run -e $b"
          done

      - name: Versionsnummer bestimmen
        id: version
        run: |
          set -euo pipefail
          cd repo
          
          MESHTASTIC_VERSION=""
          IS_TAG_BUILD="${{ steps.target.outputs.is_tag_build }}"
          TARGET_REF="${{ steps.target.outputs.target_ref }}"
          BUILD_TYPE="${{ steps.target.outputs.build_type }}"
          
          echo "=== 🏷️ Git Tag Detection ==="
          echo "Build Type: $BUILD_TYPE"
          echo "Is Tag Build: $IS_TAG_BUILD"
          echo "Target Ref: $TARGET_REF"
          
          # Für Tag-Builds: Verwende den Tag direkt
          if [ "$IS_TAG_BUILD" == "true" ] && [[ "$TARGET_REF" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            MESHTASTIC_VERSION="${BASH_REMATCH[1]}"
            echo "✅ Using specified tag version: $MESHTASTIC_VERSION"
          fi
          
          # Fallback-Methoden für develop builds
          if [ -z "$MESHTASTIC_VERSION" ]; then
            CURRENT_TAG=$(git describe --exact-match --tags HEAD 2>/dev/null || echo "")
            if [ -n "$CURRENT_TAG" ]; then
              echo "✅ Current commit is on tag: $CURRENT_TAG"
              MESHTASTIC_VERSION="${CURRENT_TAG#v}"
            fi
          fi
          
          if [ -z "$MESHTASTIC_VERSION" ]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ]; then
              echo "✅ Latest reachable tag: $LATEST_TAG"
              MESHTASTIC_VERSION="${LATEST_TAG#v}"
            fi
          fi
          
          if [ -z "$MESHTASTIC_VERSION" ]; then
            echo "📋 Available tags:"
            git tag --sort=-version:refname | head -10 || true
            LATEST_TAG=$(git tag --sort=-version:refname | head -1 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ]; then
              echo "✅ Using latest available tag: $LATEST_TAG"
              MESHTASTIC_VERSION="${LATEST_TAG#v}"
            fi
          fi
          
          # Source-Code Fallback
          if [ -z "$MESHTASTIC_VERSION" ]; then
            echo "🔍 Trying to extract version from source files..."
            for file in "src/mesh/generated/version.h" "version.h" "src/main.cpp" "platformio.ini"; do
              if [ -f "$file" ]; then
                echo "Checking $file"
                VERSION_FOUND=$(grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' "$file" | head -1 || echo "")
                if [ -n "$VERSION_FOUND" ]; then
                  MESHTASTIC_VERSION="$VERSION_FOUND"
                  echo "✅ Found version in $file: $MESHTASTIC_VERSION"
                  break
                fi
              fi
            done
          fi
          
          # Final Fallback
          if [ -z "$MESHTASTIC_VERSION" ]; then
            MESHTASTIC_VERSION="2.7.12"
            echo "⚠️ Using fallback version: $MESHTASTIC_VERSION"
          fi
          
          # Git-Info
          GIT_HASH=$(git rev-parse --short HEAD)
          TS=$(date -u +%Y%m%d-%H%M%S)
          
          # Versionen je nach Build-Typ
          if [ "$IS_TAG_BUILD" == "true" ]; then
            # Für Tags: Saubere Version ohne Timestamp
            FULL_VERSION="${MESHTASTIC_VERSION}-mh-${GIT_HASH}"
            SHORT_VERSION="${MESHTASTIC_VERSION}-mh"
            DISPLAY_VERSION="${MESHTASTIC_VERSION}-MH"
            echo "🏷️ Tag build - clean versioning"
          else
            # Für develop: Mit Timestamp
            FULL_VERSION="${MESHTASTIC_VERSION}-mh-${GIT_HASH}-${TS}"
            SHORT_VERSION="${MESHTASTIC_VERSION}-mh-${GIT_HASH}"
            DISPLAY_VERSION="${MESHTASTIC_VERSION}-MH-dev"
            echo "🔄 Develop build - timestamped versioning"
          fi
          
          echo "base_version=$MESHTASTIC_VERSION" >> $GITHUB_OUTPUT
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "short_version=$SHORT_VERSION" >> $GITHUB_OUTPUT
          echo "display_version=$DISPLAY_VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$TS" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          
          echo "=== 📋 Final Version Info ==="
          echo "Meshtastic Base: $MESHTASTIC_VERSION"
          echo "Full Version: $FULL_VERSION"
          echo "Short Version: $SHORT_VERSION"  
          echo "Display Version: $DISPLAY_VERSION"
          echo "Build Type: $BUILD_TYPE"

      # Rest der Steps bleiben gleich...
      - name: Firmware einsammeln und strukturieren
        id: firmware
        run: |
          set -euo pipefail
          mkdir -p firmware-output
          cd repo
          
          VERSION="${{ steps.version.outputs.version }}"
          COLLECTED_BOARDS=""
          
          for b in $BOARDS; do
            echo "📦 Sammle Firmware für Board: $b"
            BOARD_FILES=""
            
            # Suche nach Firmware-Dateien in verschiedenen Varianten
            for variant in "" "-factory" "-update" "-ota"; do
              for ext in bin uf2 hex; do
                possible_files=(
                  ".pio/build/$b/firmware${variant}.$ext"
                  ".pio/build/$b/firmware.$ext"
                  "build_output/$b/firmware${variant}.$ext"
                )
                
                for f in "${possible_files[@]}"; do
                  if [ -f "$f" ]; then
                    target_name="firmware-${b}${variant}-${VERSION}.$ext"
                    cp "$f" "../firmware-output/$target_name"
                    echo "✅ Kopiert: $f -> $target_name"
                    BOARD_FILES="$BOARD_FILES $target_name"
                    break
                  fi
                done
              done
            done
            
            # Fallback: Wenn keine Varianten gefunden, suche nach generischen Dateien
            if [ -z "$BOARD_FILES" ]; then
              for ext in bin uf2 hex; do
                f=".pio/build/$b/firmware.$ext"
                if [ -f "$f" ]; then
                  target_name="firmware-${b}-${VERSION}.$ext"
                  cp "$f" "../firmware-output/$target_name"
                  echo "✅ Kopiert (generic): $f -> $target_name"
                  BOARD_FILES="$BOARD_FILES $target_name"
                  
                  # Erstelle zusätzliche Varianten
                  cp "$f" "../firmware-output/firmware-${b}-factory-${VERSION}.$ext"
                  cp "$f" "../firmware-output/firmware-${b}-update-${VERSION}.$ext"
                fi
              done
            fi
            
            if [ -n "$BOARD_FILES" ]; then
              COLLECTED_BOARDS="$COLLECTED_BOARDS $b"
            else
              echo "⚠️ WARNUNG: Keine Firmware für Board $b gefunden"
            fi
          done
          
          cd ..
          echo "collected_boards=$COLLECTED_BOARDS" >> $GITHUB_OUTPUT
          
          echo "=== 📦 Gesammelte Firmware-Dateien ==="
          ls -lah firmware-output/ || true

      # Rest deiner Steps bleibt unverändert...
      - name: Release erstellen
        id: release
        if: steps.firmware.outputs.collected_boards != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_DATE="${{ steps.version.outputs.build_date }}"
          BUILD_TYPE="${{ steps.version.outputs.build_type }}"
          TAG="firmware-${VERSION}"
          NAME="Firmware Build ${VERSION}"
          API="https://api.github.com/repos/${OWNER_REPO}"
          
          # Release body erstellen
          cat > release_body.md << EOF
          # 🚀 Automatischer Firmware Build
          
          **Version:** ${VERSION}  
          **Build-Datum:** ${BUILD_DATE}  
          **Build-Typ:** ${BUILD_TYPE}  
          **Boards:** ${{ steps.firmware.outputs.collected_boards }}
          
          ## 🔧 Änderungen
          - Automatischer Sync mit Upstream
          - Custom userPrefs angewendet
          - Für folgende Hardware gebaut: ${{ steps.firmware.outputs.collected_boards }}
          
          ## 📱 Installation
          Verwende den [Web Flasher](https://flasher.schwarzes-seelenreich.de) für einfache Installation.
          EOF
          
          # jq installieren falls nicht vorhanden
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi
          
          # Release erstellen
          http=$(curl -sS -L -w "%{http_code}" -o resp.json \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API/releases" \
            -d "{
              \"tag_name\":\"$TAG\",
              \"name\":\"$NAME\",
              \"body\":$(jq -Rs . release_body.md),
              \"draft\":false,
              \"prerelease\":true
            }")
          
          echo "Create release HTTP: $http"
          
          if [ "$http" -eq 422 ]; then
            echo "Release bereits vorhanden, lade bestehende..."
            curl -sS -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$API/releases/tags/$TAG" -o resp.json
          elif [ "$http" -ge 400 ]; then
            echo "Release-Erstellung fehlgeschlagen!"
            cat resp.json
            exit 1
          fi
          
          # Upload URL extrahieren
          upload_url=$(jq -r '.upload_url | sub("\\{.*$"; "")' resp.json)
          release_id=$(jq -r '.id' resp.json)
          
          echo "upload_url=$upload_url" >> $GITHUB_OUTPUT
          echo "release_id=$release_id" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

      - name: Assets hochladen
        if: steps.release.outputs.upload_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          upload_url="${{ steps.release.outputs.upload_url }}"
          
          shopt -s nullglob
          for path in firmware-output/*; do
            [ -f "$path" ] || continue
            name=$(basename "$path")
            
            echo "📤 Upload: $name"
            http=$(curl -sS -L -w "%{http_code}" -o /dev/null \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              "${upload_url}?name=${name}" \
              --data-binary @"$path")
            
            if [ "$http" -ge 400 ]; then
              echo "❌ FEHLER beim Upload von $name (HTTP $http)"
              exit 1
            else
              echo "✅ $name hochgeladen (HTTP $http)"
            fi
          done

      - name: Backend benachrichtigen
        if: steps.release.outputs.tag_name != ''
        env:
          GH_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
        run: |
          set -euo pipefail
          
          VERSION="${{ steps.version.outputs.version }}"
          SHORT_VERSION="${{ steps.version.outputs.short_version }}"
          BUILD_DATE="${{ steps.version.outputs.build_date }}"
          TAG="${{ steps.release.outputs.tag_name }}"
          RELEASE_URL="https://github.com/${OWNER_REPO}/releases/tag/${TAG}"
          DISPLAY_VERSION="${{ steps.version.outputs.display_version }}"
          BASE_VERSION="${{ steps.version.outputs.base_version }}"
          BUILD_TYPE="${{ steps.version.outputs.build_type }}"
          
          # Boards-Array für JSON erstellen
          BOARDS_RAW="${{ steps.firmware.outputs.collected_boards }}"
          echo "Raw boards: '$BOARDS_RAW'"
          
          BOARDS_JSON="[]"
          if [ -n "$BOARDS_RAW" ]; then
            BOARDS_JSON=$(echo "$BOARDS_RAW" | jq -R 'split(" ") | map(select(. != ""))')
          fi
          
          echo "=== 📡 Backend Notification Debug ==="
          echo "Version: $VERSION"
          echo "Short Version: $SHORT_VERSION"
          echo "Display Version: $DISPLAY_VERSION"
          echo "Build Type: $BUILD_TYPE"
          echo "Download Base URL: https://github.com/${OWNER_REPO}/releases/download/${TAG}"
          echo "Boards JSON: $BOARDS_JSON"
          
          DISPATCH_PAYLOAD="{
            \"event_type\": \"firmware-built\",
            \"client_payload\": {
              \"version\": \"$VERSION\",
              \"short_version\": \"$SHORT_VERSION\",
              \"base_version\": \"$BASE_VERSION\",
              \"display_version\": \"$DISPLAY_VERSION\",
              \"build_date\": \"$BUILD_DATE\",
              \"build_type\": \"$BUILD_TYPE\",
              \"tag_name\": \"$TAG\",
              \"release_url\": \"$RELEASE_URL\",
              \"download_base_url\": \"https://github.com/${OWNER_REPO}/releases/download/${TAG}\",
              \"boards\": $BOARDS_JSON,
              \"branch\": \"$BRANCH\"
            }
          }"
          
          echo "Dispatch payload:"
          echo "$DISPATCH_PAYLOAD" | jq .
          
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${BACKEND_REPO}/dispatches" \
            -d "$DISPATCH_PAYLOAD"
          
          echo "✅ Backend benachrichtigt für Version: $VERSION"

name: Build Specific Tag
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g., v2.7.12)'
        required: true
        type: string
      boards:
        description: 'Boards to build (space separated)'
        required: false
        default: "heltec-v3 heltec-wireless-tracker-V1-0"
        type: string

permissions:
  contents: write

jobs:
  build_tag:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: infinitecoding/platformio-for-ci:latest
      BOARDS: ${{ github.event.inputs.boards }}
      CONFIG_SRC: my-userprefs.jsonc
      CONFIG_DEST: userPrefs.jsonc
      OWNER_REPO: ${{ github.repository }}
      BACKEND_REPO: "SMLunchen/mh_flasher_backend"
      TARGET_TAG: ${{ github.event.inputs.tag }}
      
    steps:
      - name: Repo klonen und Tag auschecken
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "🏷️ Cloning repository and checking out tag: $TARGET_TAG"
          git clone "https://x-access-token:${TOKEN}@github.com/${OWNER_REPO}.git" repo
          cd repo
          git fetch --tags
          git checkout "tags/$TARGET_TAG"
          git submodule update --init --recursive
          
          echo "✅ Checked out tag: $TARGET_TAG"
          echo "Current HEAD: $(git rev-parse HEAD)"

      # Rest der Steps wie in der ersten Action, aber ohne Upstream-Merge
      # ... (userPrefs, Docker, Build, Version, etc.)
